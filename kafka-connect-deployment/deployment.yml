apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-kafka-connect
  labels:
    system: debezium
    component: kafka-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      system: debezium
      component: kafka-connect
  template:
    metadata:
      labels:
        system: debezium
        component: kafka-connect
    spec:
      containers:
      - name: kafka-connect
        image: quay.io/debezium/connect:2.7.3.Final
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: kafka-http
          protocol: TCP
        resources:
          limits:
            cpu: "500m"
            memory: 2Gi
          requests:
            cpu: "200m"
            memory: 1Gi
        env:
        - name: BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: GROUP_ID
          value: debezium-kafka-connect-cluster
        - name: CONFIG_STORAGE_TOPIC
          value: debezium-kafka-connect-configs
        - name: OFFSET_STORAGE_TOPIC
          value: debezium-kafka-connect-offsets
        - name: STATUS_STORAGE_TOPIC
          value: debezium-kafka-connect-status
        - name: CONFIG_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: OFFSET_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: STATUS_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: KEY_CONVERTER
          value: org.apache.kafka.connect.json.JsonConverter
        - name: VALUE_CONVERTER
          value: org.apache.kafka.connect.json.JsonConverter
        - name: KEY_CONVERTER_SCHEMAS_ENABLE
          value: "false"
        - name: VALUE_CONVERTER_SCHEMAS_ENABLE
          value: "false"
        - name: CONNECT_PLUGIN_PATH
          value: /kafka/connect
        - name: CONNECT_REST_PORT
          value: "8083"
        - name: CONNECT_REST_ADVERTISED_PORT
          value: "8083"
        - name: CONNECT_CLIENT_ID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: CONNECT_REST_ADVERTISED_HOST_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        volumeMounts:
        - mountPath: /opt/kafka/etc/log4j.properties
          name: configmap
          subPath: log4j.properties
      volumes:
      - configMap:
          defaultMode: 420
          name: debezium-kafka-connect-conf
        name: configmap